$schema: https://json-schema.org/draft-07/schema
$defs:
  RepositoryConfig:
    additionalProperties: false
    properties:
      deploy_script:
        anyOf:
        - format: path
          type: string
        - type: 'null'
        default: null
        title: Deploy Script
      static_dir:
        anyOf:
        - format: path
          type: string
        - type: 'null'
        default: null
        title: Static Dir
    title: RepositoryConfig
    type: object
additionalProperties: false
properties:
  $schema:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    title: $Schema
  webhook_secret:
    title: Webhook Secret
    type: string
  app_root_path:
    default: ''
    title: App Root Path
    type: string
  deploy_timeout_seconds:
    default: 1800
    exclusiveMinimum: 0
    title: Deploy Timeout Seconds
    type: integer
  heartbeat_interval_seconds:
    default: 15
    exclusiveMinimum: 0
    title: Heartbeat Interval Seconds
    type: integer
  repositories:
    additionalProperties:
      anyOf:
      - $ref: '#/$defs/RepositoryConfig'
      - additionalProperties:
          $ref: '#/$defs/RepositoryConfig'
        type: object
    description: A dictionary of repositories to deploy. The key is the repository
      name, and the value is a RepositoryConfig object. The RepositoryConfig object
      can be a single object, or a dictionary with the keys to be environment names
      (f.e. staging, pre, production).
    title: Repositories
    type: object
required:
- webhook_secret
- repositories
title: Settings
type: object
